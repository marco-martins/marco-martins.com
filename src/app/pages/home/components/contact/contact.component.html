<section class="contact" id="contact" aria-labelledby="contact-title">
  <div class="wrap contact-inner">
    <div>
      <h2 id="contact-title" class="section-label"><span class="dot"></span> 05 / CONTACT</h2>
      <p class="section-slogan">GREAT IDEAS START<br />WITH A <span>CONVERSATION.</span></p>
    </div>
    <div class="contact-action">
      <p>
        Let’s exchange ideas, talk technology<br />
        or explore working together.
      </p>
      <nav class="contact-links" aria-label="Contact and social links">
        <a
          href="https://www.linkedin.com/in/marcopmartins/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Marco Martins on LinkedIn (opens in a new tab)"
          title="LinkedIn"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <path d="M7.5 10.5v7M11.5 17.5v-7m0 3a3 3 0 0 1 6 0v4" />
            <circle cx="7.5" cy="7" r=".65" fill="currentColor" stroke="none" />
          </svg>
        </a>
        <a
          href="https://github.com/marco-martins"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Marco Martins on GitHub (opens in a new tab)"
          title="GitHub"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 6v-3.9a3.4 3.4 0 0 0-1-2.6c3.3-.4 6.8-1.6 6.8-7.3A5.7 5.7 0 0 0 19.3 4a5.3 5.3 0 0 0-.1-3s-1.3-.4-4.2 1.6a14.4 14.4 0 0 0-7.5 0C4.6.6 3.3 1 3.3 1a5.3 5.3 0 0 0-.1 3 5.7 5.7 0 0 0-1.5 4.2c0 5.7 3.5 6.9 6.8 7.3A3.4 3.4 0 0 0 7.5 18v4"
              transform="translate(1 1) scale(.9)"
            />
          </svg>
        </a>
        <button
          type="button"
          (click)="loadMail()"
          aria-label="Send an email to Marco Martins"
          title="Email"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="2.5" y="5" width="19" height="14" rx="2" />
            <path d="m3 6 9 7 9-7" />
          </svg>
        </button>
      </nav>
    </div>
  </div>
</section>
