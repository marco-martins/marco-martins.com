<section id="projects" class="personal-projects wrap section" aria-labelledby="projects-title">
  <h2 id="projects-title" class="section-label">
    <span class="dot"></span> 03 / PROJECTS & OPEN SOURCE
  </h2>
  <div class="section-heading">
    <p class="section-slogan">
      IDEAS AND CHALLENGES.<br />
      <span class="blue">REAL PROJECTS.</span>
    </p>
    <p>
      A selection of products and tools<br />
      I’ve helped build.
    </p>
  </div>
  <div class="personal-grid">
    @for (item of items(); track item.id) {
      <article class="personal-project">
        <div class="project-thumbnail">
          <img
            [ngSrc]="item.image.src"
            [alt]="item.image.alt"
            width="1600"
            height="800"
            loading="lazy" />
          <div class="project-tint" aria-hidden="true"></div>
        </div>
        <div class="project-info">
          <div class="personal-project-top">
            <span class="project-type">{{ item.category }}</span>
            <span class="skill-number">{{ $index + 1 | leadingZero }} /</span>
          </div>
          <h3>
            <a [href]="item.url" target="_blank" rel="noopener noreferrer">
              {{ item.name }}<span aria-hidden="true">↗</span>
            </a>
          </h3>
          <p>{{ item.description }}</p>
        </div>
      </article>
    }
  </div>
  <a
    class="text-link github-link"
    href="https://github.com/marco-martins"
    target="_blank"
    rel="noopener noreferrer"
    >More on GitHub <span aria-hidden="true">↗</span></a
  >
</section>
